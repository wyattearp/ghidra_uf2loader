name: Build and Test Ghidra UF2 Loader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Ghidra
      uses: actions/cache@v4
      with:
        path: .ghidra_cache
        key: ghidra-cache-${{ runner.os }}-${{ hashFiles('scripts/run_tests.sh') }}

    - name: Run Java Build
      run: |
        echo "build here"
        echo "unzip based install here"

    - name: Run Tests
      run: |
        ./scripts/run_tests.sh tests/examples/bus_pirate5_rev8.uf2
        ./scripts/run_tests.sh tests/examples/bus_pirate5_rev10.uf2
        ./scripts/run_tests.sh tests/examples/.uf2

    - name: Package Release
      if: success()
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="$(echo ${{ github.sha }} | cut -c1-7)"
        fi
        ZIP_NAME="ghidra-uf2-loader-${VERSION}.zip"
        
        mkdir -p release/ghidra-uf2-loader
        cp -r ghidra_scripts release/ghidra-uf2-loader/
        cp README.md release/ghidra-uf2-loader/
        cp LICENSE release/ghidra-uf2-loader/
        cd release
        zip -r "${ZIP_NAME}" ghidra-uf2-loader/
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ghidra-uf2-loader-${{ env.GHIDRA_VERSION }}
        path: release/${{ env.ZIP_NAME }}
