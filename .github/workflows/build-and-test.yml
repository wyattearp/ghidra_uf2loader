name: Build and Test Ghidra UF2 Loader

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Ghidra
      uses: actions/cache@v4
      with:
        path: .ghidra_cache
        key: ghidra-cache-${{ runner.os }}-${{ hashFiles('scripts/run_tests.sh') }}

    - name: Build Extension
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="$(echo ${{ github.sha }} | cut -c1-7)"
        fi
        # Replace placeholders in extension.properties
        sed -i "s/name=@extname@/name=ghidra_uf2loader/" extension.properties
        sed -i "s/version=@extversion@/version=${VERSION}/" extension.properties
        
        ./scripts/run_tests.sh build
        # Rename the zip to include the version in the filename
        ZIP_FILE=$(ls dist/*.zip)
        mv "$ZIP_FILE" "${ZIP_FILE%.zip}_${VERSION}.zip"

    - name: Run Tests
      run: |
        ./scripts/run_tests.sh test

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ghidra-uf2-loader-extension
        path: dist/*.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.zip
        generate_release_notes: true
        draft: false
        prerelease: false
